<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;background:#f7f2ee;color:#191c21;font:16px/1.55 Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f2ee">
<tr><td align="center" style="padding:24px 12px">
<!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;table-layout:fixed;background:#fff;border:2px solid #191c21;border-radius:16px;text-align:left">
<tr><td style="padding:22px 24px;border-bottom:2px solid #191c21;font-size:21px;font-weight:bold">Conecta <span style="color:#bc0017">Nexus</span> <span aria-hidden="true" style="color:#bc0017;font-size:14px">●</span></td></tr>
<tr><td style="padding:24px;word-break:break-word;overflow-wrap:anywhere">
<h1 style="font-size:28px;line-height:1.2;margin:0 0 20px">{{ subject }}</h1>
{% block body %}{% endblock %}
<p style="margin:26px 0 2px"><a href="{{ action_url }}" style="display:inline-block;padding:12px 20px;background:#bc0017;border:2px solid #bc0017;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold">{{ action_label }}</a></p>
</td></tr>
<tr><td style="padding:16px 24px;border-top:1px solid #dad7d3;color:#595d62;font-size:14px">Conecta Nexus · Notificación automática</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body>
</html>
