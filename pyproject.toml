[project]
name = "notification"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.146.0",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = ["coverage>=7.10,<8", "httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
